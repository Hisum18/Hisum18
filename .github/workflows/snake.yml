name: snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#E52D27&color_dots=#ebedf0,#ffc9c9,#ff8a8a,#e52d27,#8b0000
            dist/snake-dark.svg?palette=github-dark&color_snake=#FF3B3B&color_dots=#161b22,#4c0b0b,#8b0000,#c41e1e,#ff3b3b

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
